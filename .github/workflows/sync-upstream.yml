name: Sync from upstream

# Merges mozilla/pontoon into the sync/upstream branch and opens a pull request
# into main. It never rebases or force pushes main; see README step 6. When the
# merge has conflicts it pushes nothing and lists them in the job summary.

on:
  schedule:
    - cron: "0 2 * * 1" # Mondays 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # Upstream history modifies .github/workflows and GITHUB_TOKEN has no
      # workflows permission, so pushing the sync branch likely needs a token
      # with Contents, Pull requests and Workflows write. See README step 6.
      GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || github.token }}

      # A human may be resolving conflicts on that branch; never overwrite it.
      - name: Skip if a sync pull request is already open
        id: open-pr
        run: |
          url=$(gh pr list --head sync/upstream --state open --json url --jq '.[0].url // empty')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ -n "$url" ]; then
            echo "A sync pull request is already open: $url - merge or close it first." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-python@v6
        if: steps.open-pr.outputs.url == ''
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v6
        if: steps.open-pr.outputs.url == ''
        with:
          node-version: lts/krypton
          cache: npm

      - name: Install Python dependencies
        if: steps.open-pr.outputs.url == ''
        run: |
          # psycopg2 builds from source.
          sudo apt-get install -y --no-install-recommends libpq-dev
          # uv, as in docker/Dockerfile: the compiled requirements omit
          # setuptools, which pip's hash-checking mode refuses.
          python -m pip install uv==0.11.23
          python -m uv pip install --system -r requirements/default.txt -r requirements/lint.txt

      - name: Merge upstream
        id: merge
        if: steps.open-pr.outputs.url == ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export SYNC_REPORT="$RUNNER_TEMP/sync-report.md"
          rc=0
          bin/sync-upstream.sh merge || rc=$?
          cat "$SYNC_REPORT" >> "$GITHUB_STEP_SUMMARY"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          case "$rc" in
            0|10) ;;
            20) echo "::error::Upstream merge has conflicts. Run 'make sync-upstream' locally; the summary lists the files."
                exit 1 ;;
            30) echo "::error::Upstream merged but verification failed. Run 'make sync-upstream' locally to reproduce."
                exit 1 ;;
            *) exit "$rc" ;;
          esac

      - name: Open pull request
        if: steps.merge.outputs.rc == '0'
        run: SYNC_REPORT="$RUNNER_TEMP/sync-report.md" bin/sync-upstream.sh pr
